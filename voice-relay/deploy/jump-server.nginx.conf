map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 9000;
    server_name 198.80.5.110;

    client_max_body_size 50m;
    proxy_ssl_server_name on;

    location = /health {
        default_type text/plain;
        return 200 'ok';
    }

    location /compatible-mode/v1/ {
        proxy_pass https://dashscope.aliyuncs.com/compatible-mode/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host dashscope.aliyuncs.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location /api/v1/ {
        proxy_pass https://dashscope.aliyuncs.com/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host dashscope.aliyuncs.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location = /api-ws/v1/inference {
        proxy_pass https://dashscope.aliyuncs.com/api-ws/v1/inference;
        proxy_http_version 1.1;
        proxy_set_header Host dashscope.aliyuncs.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
