# V2.x jump server nginx for outbound DashScope access from intranet.
# Suggested relay env mapping:
#   CLOUD_BASE_URL=http://<jump-server>:9000/compatible-mode/v1
#   DASHSCOPE_HTTP_BASE_URL=http://<jump-server>:9000/api/v1
#   DASHSCOPE_WEBSOCKET_BASE_URL=ws://<jump-server>:9000/api-ws/v1/inference
#   QWEN_TTS_REALTIME_WS_URL=ws://<jump-server>:9000/api-ws/v1/realtime

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 9000;
    server_name 198.80.5.110;

    client_max_body_size 50m;
    proxy_ssl_server_name on;

    location = /health {
        default_type text/plain;
        return 200 'ok';
    }

    # OpenAI-compatible LLM access
    location /compatible-mode/v1/ {
        proxy_pass https://dashscope.aliyuncs.com/compatible-mode/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host dashscope.aliyuncs.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # DashScope HTTP APIs, still needed for sync fallback
    location /api/v1/ {
        proxy_pass https://dashscope.aliyuncs.com/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host dashscope.aliyuncs.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # ASR realtime and legacy websocket inference
    location = /api-ws/v1/inference {
        proxy_pass https://dashscope.aliyuncs.com/api-ws/v1/inference;
        proxy_http_version 1.1;
        proxy_set_header Host dashscope.aliyuncs.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # Qwen TTS realtime websocket
    location = /api-ws/v1/realtime {
        proxy_pass https://dashscope.aliyuncs.com/api-ws/v1/realtime;
        proxy_http_version 1.1;
        proxy_set_header Host dashscope.aliyuncs.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
